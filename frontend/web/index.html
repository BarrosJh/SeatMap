<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="SeatMap - Sistema Corporativo de Reserva e Gestão Inteligente de Assentos">
  
  <!-- PWA Mobile Capabilities -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SeatMap">
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#0F172A">
  <meta name="msapplication-navbutton-color" content="#0F172A">

  <title>SeatMap - Reserva de Assentos</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0F172A;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    .splash-logo {
      font-size: 28px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .splash-logo span {
      color: #3B82F6;
    }
    .splash-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-radius: 50%;
      border-top-color: #3B82F6;
      animation: spin 0.8s linear infinite;
    }
    .splash-text {
      margin-top: 16px;
      font-size: 13px;
      color: #94A3B8;
      font-weight: 500;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="splash-logo">
      Seat<span>Map</span>
    </div>
    <div class="splash-spinner"></div>
    <div class="splash-text">Iniciando sistema...</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function(err) {
          console.debug('PWA Service Worker registration skipped:', err);
        });
      });
    }
    window._flutter = {
      config: {
        useLocalCanvasKit: true,
        canvasKitBaseUrl: "canvaskit/"
      }
    };

    // Remove o splash screen assim que o primeiro frame do Flutter for montado
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() {
          splash.remove();
        }, 400);
      }
    });
  </script>
  <script id="mobile-scanner-barcode-reader" type="application/javascript" src="zxing.min.js" defer></script>
  <script src="webauthn_bridge.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
