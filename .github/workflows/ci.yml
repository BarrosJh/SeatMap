name: SeatMap CI Pipeline (Enterprise Quality Gate)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      run_staging_smoke:
        description: 'Executar smoke test no ambiente de staging'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI (TypeScript, Audit, Build & Jest Tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies (High/Critical)
        run: npm audit --audit-level=high

      - name: Verify TypeScript Type Checking
        run: npm run typecheck

      - name: Compile Backend Production Build
        run: npm run build

      - name: Build Production Container
        run: docker build --tag seatmap-backend:${{ github.sha }} .

      - name: Scan Production Container
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: seatmap-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Run Automated Jest Unit & Integration Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret_key_seatmap_2026

  frontend-ci:
    name: Frontend CI (Flutter Analyze, Tests & Web Build)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Static Analysis (Flutter Analyze)
        run: flutter analyze

      - name: Run Automated Flutter Unit Tests
        run: flutter test

      - name: Check Flutter Dependency Health
        run: flutter pub outdated --no-dev-dependencies

      - name: Compile Flutter Web Release Build
        run: flutter build web --release --no-tree-shake-icons

  dependency-review:
    name: Dependency Review (Pull Requests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Review Dependency Changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Skip Diff Review on Push
        if: github.event_name != 'pull_request'
        run: echo "Dependency diff review is only applicable to pull requests."

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Repository for Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-analysis:
    name: SAST Analysis (CodeQL & Semgrep Security Scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL Analysis (JavaScript/TypeScript)
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

      - name: Run Semgrep SAST Security Rules
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/typescript
            p/secrets
        env:
          SEMGREP_RULES: p/security-audit

  sbom-generation:
    name: SBOM Generation (CycloneDX / SPDX Standard)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Backend SBOM (CycloneDX / Syft)
        uses: anchore/sbom-action@v0.17.9
        with:
          path: ./backend
          format: 'cyclonedx-json'
          output-file: 'sbom-backend-cyclonedx.json'

      - name: Generate Frontend SBOM (CycloneDX / Syft)
        uses: anchore/sbom-action@v0.17.9
        with:
          path: ./frontend
          format: 'cyclonedx-json'
          output-file: 'sbom-frontend-cyclonedx.json'

      - name: Archive SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: software-bill-of-materials
          path: |
            sbom-backend-cyclonedx.json
            sbom-frontend-cyclonedx.json
          retention-days: 90

  quality-gate:
    name: Release Quality Gate
    needs: [backend-ci, frontend-ci, dependency-review, secret-scan, sast-analysis, sbom-generation]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Reject Failed Required Jobs
        if: >
          needs.backend-ci.result != 'success' ||
          needs.frontend-ci.result != 'success' ||
          needs.dependency-review.result != 'success' ||
          needs.secret-scan.result != 'success' ||
          needs.sast-analysis.result != 'success' ||
          needs.sbom-generation.result != 'success'
        run: |
          echo "Quality gate rejected: backend=${{ needs.backend-ci.result }}, frontend=${{ needs.frontend-ci.result }}, dependencies=${{ needs.dependency-review.result }}, secrets=${{ needs.secret-scan.result }}, sast=${{ needs.sast-analysis.result }}, sbom=${{ needs.sbom-generation.result }}"
          exit 1

      - name: Approve Quality Gate
        run: echo "Enterprise security quality gate successfully approved (SAST, SCA, SBOM, Secrets, Tests passed)."

  staging-smoke:
    name: Staging Smoke Test (Manual Promotion)
    needs: quality-gate
    if: github.event_name == 'workflow_dispatch' && inputs.run_staging_smoke == true
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Verify Staging Health
        env:
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          INTERNAL_HEALTH_TOKEN: ${{ secrets.INTERNAL_HEALTH_TOKEN }}
        run: |
          test -n "$STAGING_HEALTH_URL"
          test -n "$INTERNAL_HEALTH_TOKEN"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            -H "x-health-token: $INTERNAL_HEALTH_TOKEN" \
            "$STAGING_HEALTH_URL/api/health/ready"

      - name: Verify Staging Metrics Endpoint
        env:
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          INTERNAL_HEALTH_TOKEN: ${{ secrets.INTERNAL_HEALTH_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -H "x-health-token: $INTERNAL_HEALTH_TOKEN" \
            "$STAGING_HEALTH_URL/api/health/metrics"

  dast-scan:
    name: Dynamic Application Security Testing (DAST / OWASP ZAP)
    needs: quality-gate
    if: github.event_name == 'workflow_dispatch' && inputs.run_staging_smoke == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline DAST Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.STAGING_HEALTH_URL || 'http://localhost:3000' }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: false

