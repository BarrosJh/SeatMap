_REQUEST>
ja como um Engenheiro Especialista em Front-End Flutter.

Analise o arquivo SVG anexado abaixo, que representa a planta baixa interativa de um escritório para um sistema de hot-desking (reserva de estações de trabalho).

Requisitos do Código:

Mapeamento de Dados: Analise o SVG e extraia todas as mesas identificáveis em uma lista imutável de objetos DeskModel contendo id, number (extraído das tags <text>), coordenadas relativas dx, dy, dimensões e ângulo de rotação.

Estado e Status: Crie um enum DeskStatus { available, occupied, reserved, selected }. Cada status deve ter cores distintas seguindo Material 3 (ex.: verde suave para disponível, cinza para ocupado, âmbar para reservado e azul/borda destacada para selecionado).

Arquitetura Visual: Implemente um widget interativo usando InteractiveViewer (com limites de zoom minScale: 0.5, maxScale: 3.0).

Renderização de Alta Performance: Renderize os elementos estruturais (paredes e divisórias) como camada estática de fundo e as mesas como widgets interativos (Positioned + Transform.rotate ou via CustomPainter com detecção precisa de hit test).

Interatividade: Ao tocar em uma mesa disponível, invoque o callback onDeskSelected(DeskModel desk) e exiba um modal bottom sheet com as informações da estação e o botão de confirmação da reserva.

