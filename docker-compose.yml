services:
  postgres:
    image: postgres:16-alpine
    container_name: seatmap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-seatmap_db}
      POSTGRES_USER: ${DB_USER:-seatmap_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-seatmap_password}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-seatmap_user} -d ${DB_NAME:-seatmap_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - seatmap_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seatmap_api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
      TZ: America/Sao_Paulo
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-seatmap_db}
      DB_USER: ${DB_USER:-seatmap_user}
      DB_PASSWORD: ${DB_PASSWORD:-seatmap_password}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_seatmap_2026_change_in_prod}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1d}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:-super_secret_admin_mfa_jwt_key_seatmap_2026}
      JWT_ADMIN_EXPIRATION: ${JWT_ADMIN_EXPIRATION:-2h}
      MFA_CODE_EXPIRATION_MINUTES: ${MFA_CODE_EXPIRATION_MINUTES:-5}
      DEFAULT_WEEKLY_LIMIT: ${DEFAULT_WEEKLY_LIMIT:-2}
      DEFAULT_CHECKIN_CUTOFF_TIME: ${DEFAULT_CHECKIN_CUTOFF_TIME:-11:00}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - seatmap_network

volumes:
  pgdata:
    driver: local

networks:
  seatmap_network:
    driver: bridge

